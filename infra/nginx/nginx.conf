# Nginx is the single front door: it serves the web app and load-balances
# requests across the API and gateway instances.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/css application/javascript application/json;

  # Docker's DNS returns one address per running container of a service, so
  # "api" expands to every API replica and Nginx round-robins across them.
  # Nginx resolves the name when it starts: after `docker compose up --scale`,
  # run `docker compose restart nginx` so it picks up the new replicas.
  upstream api_upstream {
    server api:3000;
    # Reuse connections to the API instead of opening one per request.
    keepalive 32;
  }

  upstream gateway_upstream {
    # WebSockets are long-lived, so "fewest open connections" spreads users
    # more evenly than round-robin does.
    least_conn;
    server gateway:4000;
  }

  # Needed to turn an HTTP request into a WebSocket (the "Upgrade" handshake).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
      proxy_pass http://gateway_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # By default Nginx closes a proxied connection after 60 s without data.
      # Chat sockets are often quiet for longer; the gateway's own heartbeat
      # (every 30 s) is what detects dead connections.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Single-page app: any other path serves index.html.
    location / {
      try_files $uri /index.html;
    }
  }
}
