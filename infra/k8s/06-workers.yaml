# Background workers. Kafka shares the topic's partitions among the pods of a
# consumer group, so with 3 partitions up to 3 replicas do useful work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workers
  namespace: relay
spec:
  replicas: 1
  selector:
    matchLabels: { app: workers }
  template:
    metadata:
      labels: { app: workers }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: workers
          image: relay-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: APP, value: workers }
            - { name: NODE_ENV, value: production }
          envFrom:
            - configMapRef: { name: relay-config }
            - secretRef: { name: relay-secrets }
          ports:
            - containerPort: 9100
          livenessProbe:
            httpGet: { path: /healthz, port: 9100 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
