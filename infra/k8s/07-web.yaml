# The Nginx image: serves the React app and proxies /api and /ws to the
# "api" and "gateway" Services above (same names as in Docker Compose, so the
# same nginx.conf works in both).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: relay
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: relay-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: relay
spec:
  selector: { app: web }
  ports:
    - port: 80
